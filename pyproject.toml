[project]
name = "pe-risk-key"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "J.J.", email = "jjpowell@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
pe-risk-key = "pe_risk_key:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
